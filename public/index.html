<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Просмотр отчёта — Погодный дайджест</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 640px;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #222;
      }
      h1 {
        font-size: 1.4rem;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 1rem;
      }
      th,
      td {
        border: 1px solid #ccc;
        padding: 0.4rem 0.6rem;
        text-align: left;
      }
      th {
        background: #f2f2f2;
      }
      #meta {
        margin-top: 1rem;
      }
      #error {
        color: #b00020;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Погодный дайджест — просмотр JSON-отчёта</h1>
    <p>
      Выберите файл отчёта из каталога <code>reports/</code> (например
      <code>Москва-2026-09-12.json</code>).
    </p>
    <input type="file" id="fileInput" accept="application/json" />
    <div id="meta"></div>
    <div id="error"></div>
    <table id="table" hidden>
      <thead>
        <tr>
          <th>Дата</th>
          <th>Мин, °C</th>
          <th>Макс, °C</th>
          <th>Осадки, мм</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <script src="viewer.js"></script>
  </body>
</html>
